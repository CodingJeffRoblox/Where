name: Release

# Builds Where for every desktop and attaches the downloads to a GitHub
# Release. Each program is built on its own kind of computer, because a
# Windows .exe, a Mac .app and a Linux program can only be made there.
#
#   Push a tag like v0.3.0  -> builds everything and publishes a Release
#   Actions > Release > Run -> builds everything as downloadable artifacts
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build engine
        run: cargo build --release -p where_ffi -p where_cli
      - name: Build app
        working-directory: apps/where_flutter
        run: |
          flutter pub get
          flutter build windows --release
      - name: Package (portable zip)
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          "WHERE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          $out = "apps/where_flutter/build/windows/x64/runner/Release"
          Copy-Item target/release/where_ffi.dll $out/
          Copy-Item target/release/where-cli.exe $out/
          Copy-Item -Recurse browser-extension "$out/browser-extension"
          # Ship the Microsoft C++ runtime next to Where.exe so it starts on
          # PCs that don't have the Visual C++ Redistributable installed.
          foreach ($dll in 'msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" $out/
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          $stage = "stage/Where"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item -Recurse "$out/*" $stage/
          Compress-Archive -Path $stage -DestinationPath "dist/Where-$version-windows-x64-portable.zip" -Force
      - name: Build installer (Where-Setup.exe)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc /Qp "/DAppVersion=$env:WHERE_VERSION" `
            "/DSourceDir=$PWD\stage\Where" "/DOutDir=$PWD\dist" `
            "/DIconFile=$PWD\apps\where_flutter\windows\runner\resources\app_icon.ico" `
            installer\windows\where.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: where-windows-x64
          path: dist/*

  macos:
    name: macOS (Apple Silicon + Intel)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build and package
        run: bash scripts/package.sh --universal --archive
      - uses: actions/upload-artifact@v4
        with:
          name: where-macos-universal
          path: dist/*

  linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
      - name: Install Flutter
        # A git clone works on both x64 and arm64 Linux.
        run: |
          git clone --depth 1 -b stable https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - name: Get appimagetool
        run: |
          tool_arch=$([ "${{ matrix.arch }}" = x64 ] && echo x86_64 || echo aarch64)
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-$tool_arch.AppImage"
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
          # Runners have no FUSE; let AppImages unpack themselves instead.
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"
      - name: Build and package (.tar.gz, .deb, .AppImage)
        run: |
          flutter config --no-analytics --enable-linux-desktop
          bash scripts/package.sh --archive
      - uses: actions/upload-artifact@v4
        with:
          name: where-linux-${{ matrix.arch }}
          path: dist/*

  extension:
    name: Browser extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip extension
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          mkdir -p dist
          (cd browser-extension && zip -r "../dist/Where-$version-browser-extension.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: where-browser-extension
          path: dist/*

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled()
    needs: [windows, macos, linux, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          ## Downloads

          | Your computer | Download | How |
          |---|---|---|
          | **Windows** 10 / 11 | `Where-Setup-…-windows-x64.exe` | Run it — installs Where with a Start menu shortcut |
          | Windows (no install) | `Where-…-windows-x64-portable.zip` | Unzip, run `Where.exe` |
          | **Mac** (Apple Silicon or Intel) | `Where-…-macos-universal.dmg` | Open, drag Where to Applications |
          | **Linux** (any distro) | `Where-…-linux-x64.AppImage` | `chmod +x` it, then double-click |
          | Ubuntu / Debian / Mint | `Where-…-linux-x64.deb` | `sudo apt install ./Where-…deb` |
          | Linux (ARM) | `…-linux-arm64.AppImage` / `.deb` / `.tar.gz` | Same as above |
          | Chrome / Edge / Brave | `Where-…-browser-extension.zip` | See Settings → Browser in Where |

          **First launch:** these builds aren't signed yet. On Windows click
          *More info → Run anyway*. On a Mac, right-click Where → *Open* the first time.
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: dist/*
          fail_on_unmatched_files: false
